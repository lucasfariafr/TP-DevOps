<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="calculator">
    <div class="display" id="display">0</div>
    <div class="buttons">
        <button class="func" onclick="clearAll()">C</button>
        <button class="func" onclick="toggleSign()">+/−</button>
        <button class="func" onclick="inputPercent()">%</button>
        <button class="op" data-op="divide" onclick="setOperator('divide', this)">÷</button>

        <button class="num" onclick="inputDigit('7')">7</button>
        <button class="num" onclick="inputDigit('8')">8</button>
        <button class="num" onclick="inputDigit('9')">9</button>
        <button class="op" data-op="multiply" onclick="setOperator('multiply', this)">×</button>

        <button class="num" onclick="inputDigit('4')">4</button>
        <button class="num" onclick="inputDigit('5')">5</button>
        <button class="num" onclick="inputDigit('6')">6</button>
        <button class="op" data-op="subtract" onclick="setOperator('subtract', this)">−</button>

        <button class="num" onclick="inputDigit('1')">1</button>
        <button class="num" onclick="inputDigit('2')">2</button>
        <button class="num" onclick="inputDigit('3')">3</button>
        <button class="op" data-op="add" onclick="setOperator('add', this)">+</button>

        <button class="num span-2" onclick="inputDigit('0')">0</button>
        <button class="num" onclick="inputDecimal()">,</button>
        <button class="op" onclick="compute()">=</button>
    </div>
</div>
<script src="app.js"></script>
</body>
</html>
